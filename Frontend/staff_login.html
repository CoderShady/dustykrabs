<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Portal Login · OPD Queuing System</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- Toasts -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <header class="app-header">
    <div class="container header-inner">
      <a href="/" class="logo-btn" style="text-decoration:none;">
        <span class="logo-mark" aria-hidden="true">＋</span>
        <span class="logo-text">OPD Queue &amp; Bed System</span>
      </a>
      <nav class="header-nav" aria-label="Main navigation">
        <a href="/" class="nav-link" style="text-decoration:none;">Home</a>
        <a href="/patient" class="nav-link" style="text-decoration:none;">Patient Portal</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="container narrow" style="padding-top: 50px; padding-bottom: 60px;">
      <a href="/" class="link-back" style="text-decoration:none; display:inline-block; margin-bottom:16px;">← Back to Home</a>
      <h2>Staff Portal Login</h2>
      <p class="section-sub">Authorized hospital personnel only. Enter your credentials to access queue and bed management.</p>

      <form id="staff-login-form" class="card form-card" novalidate style="margin-top:20px;">
        <div id="staff-login-error" class="form-error hidden" role="alert" style="margin-bottom:16px;"></div>

        <div class="field">
          <label for="staff-username">Username</label>
          <input type="text" id="staff-username" autocomplete="username" required placeholder="staff" value="staff">
        </div>
        <div class="field">
          <label for="staff-password">Password</label>
          <input type="password" id="staff-password" autocomplete="current-password" required placeholder="••••••••" value="staff123">
        </div>

        <button type="submit" id="staff-login-btn" class="btn btn-primary btn-block btn-lg" style="margin-top:20px;">
          Log In to Dashboard →
        </button>

        <p class="form-help" style="margin-top:14px; text-align:center;">
          Demo credentials: <strong>staff</strong> / <strong>staff123</strong>
        </p>
      </form>
    </section>
  </main>

  <footer class="app-footer">
    <div class="container">
      <p>OPD Queuing &amp; Bed System · Authorized Access Portal</p>
    </div>
  </footer>

  <script>
    function showToast(message, type) {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = `toast toast-${type || 'info'}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => { el.remove(); }, 3500);
    }

    document.getElementById('staff-login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const u = document.getElementById('staff-username').value.trim();
      const p = document.getElementById('staff-password').value;
      const errorEl = document.getElementById('staff-login-error');
      const btn = document.getElementById('staff-login-btn');

      if (!u || !p) {
        errorEl.textContent = 'Please enter both username and password.';
        errorEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Authenticating…';
      errorEl.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/staff-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p }),
        });
        const data = await res.json();
        if (res.ok && data.success) {
          showToast('Authenticated successfully! Redirecting…', 'success');
          setTimeout(() => {
            window.location.href = '/staff';
          }, 400);
          return;
        } else {
          errorEl.textContent = data.message || 'Invalid credentials. Please try staff / staff123.';
          errorEl.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Log In to Dashboard →';
        }
      } catch (err) {
        console.error('Login error:', err);
        errorEl.textContent = 'Server connection error. Please try again.';
        errorEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Log In to Dashboard →';
      }
    });
  </script>
</body>
</html>
